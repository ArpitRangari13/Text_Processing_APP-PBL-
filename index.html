<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinguistAI | Professional NLP Suite</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script src="https://unpkg.com/compromise"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/toxicity"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-[#f8fafc] text-slate-800 min-h-screen">

    <nav class="border-b border-slate-200 bg-white px-6 py-4 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-2">
            <div class="bg-blue-600 p-2 rounded-lg text-white">
                <i data-lucide="brain-circuit" class="w-6 h-6"></i>
            </div>
            <span class="text-xl font-bold tracking-tight text-slate-900">Linguist<span class="text-blue-600">AI</span></span>
        </div>
        <div class="flex items-center gap-4">
            <span class="text-sm font-medium text-slate-500 bg-slate-100 px-3 py-1 rounded-full">v3.3 Stable</span>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <div class="lg:col-span-5 space-y-6">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                <label class="block text-sm font-semibold text-slate-600 mb-3 uppercase tracking-wider">Source Text Analysis</label>
                <textarea id="inputText" 
                    class="w-full h-64 p-4 text-slate-700 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all custom-scrollbar text-lg"
                    placeholder="Type here... Try: 'Arpit is working at SB Jain in Nagpur. He is running very fast!'"
                ></textarea>
                
                <div class="mt-6 grid grid-cols-2 gap-3">
                    <button onclick="runNLP('tokenize')" class="flex items-center justify-center gap-2 py-2.5 px-4 bg-white border border-slate-200 rounded-lg hover:bg-slate-50 transition-all font-medium text-slate-700 shadow-sm">
                        <i data-lucide="scissors" class="w-4 h-4 text-blue-500"></i> Tokenize
                    </button>
                    <button onclick="runNLP('stopwords')" class="flex items-center justify-center gap-2 py-2.5 px-4 bg-white border border-slate-200 rounded-lg hover:bg-slate-50 transition-all font-medium text-slate-700 shadow-sm">
                        <i data-lucide="filter" class="w-4 h-4 text-orange-500"></i> Stopwords
                    </button>
                    <button onclick="runNLP('lemmatize')" class="flex items-center justify-center gap-2 py-2.5 px-4 bg-white border border-slate-200 rounded-lg hover:bg-slate-50 transition-all font-medium text-slate-700 shadow-sm">
                        <i data-lucide="git-branch" class="w-4 h-4 text-purple-500"></i> Lemmatize
                    </button>
                    <button onclick="runNLP('pos')" class="flex items-center justify-center gap-2 py-2.5 px-4 bg-white border border-slate-200 rounded-lg hover:bg-slate-50 transition-all font-medium text-slate-700 shadow-sm">
                        <i data-lucide="tags" class="w-4 h-4 text-green-500"></i> POS Tags
                    </button>
                    <button onclick="runNLP('ner')" class="flex items-center justify-center gap-2 py-2.5 px-4 bg-white border border-slate-200 rounded-lg hover:bg-slate-50 transition-all font-medium text-slate-700 shadow-sm">
                        <i data-lucide="map-pin" class="w-4 h-4 text-red-500"></i> NER
                    </button>
                    <button onclick="runTensorFlow()" class="flex items-center justify-center gap-2 py-2.5 px-4 bg-slate-900 text-white rounded-lg hover:bg-slate-800 transition-all font-medium shadow-md col-span-2">
                        <i data-lucide="shield-check" class="w-4 h-4 text-yellow-400"></i> Run Toxicity Audit (TF.js)
                    </button>
                </div>
            </div>
        </div>

        <div class="lg:col-span-7">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 h-full flex flex-col min-h-[500px]">
                <div class="border-b border-slate-100 px-6 py-4 flex justify-between items-center bg-slate-50/50 rounded-t-2xl">
                    <h2 class="font-bold text-slate-800 flex items-center gap-2">
                        <i data-lucide="terminal" class="w-5 h-5 text-blue-600"></i> Analysis Output
                    </h2>
                    <button onclick="clearOutput()" class="text-xs font-semibold text-slate-400 hover:text-red-500 transition-colors uppercase">Clear</button>
                </div>
                
                <div id="definitionBox" class="hidden mx-6 mt-4 p-4 bg-blue-50 border-l-4 border-blue-500 rounded-r-lg text-sm text-blue-800 font-medium shadow-sm">
                </div>

                <div id="output" class="p-6 flex-grow overflow-y-auto custom-scrollbar">
                    <div class="flex flex-col items-center justify-center h-full text-slate-400">
                        <i data-lucide="database" class="w-12 h-12 mb-4 opacity-20"></i>
                        <p>Awaiting linguistic input...</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        lucide.createIcons();

        const STOPWORDS = ["a", "an", "and", "are", "as", "at", "be", "but", "by", "for", "if", "in", "into", "is", "it", "no", "not", "of", "on", "or", "such", "that", "the", "their", "then", "there", "these", "they", "this", "to", "was", "will", "with"];

        const DEFINITIONS = {
            tokenize: "Tokenization: Breaking raw text into individual words or symbols so the computer can process them one by one.",
            stopwords: "Stopwords Filtering: Identifying highly common words that carry little meaning. They are highlighted in red below.",
            lemmatize: "Lemmatization: Calculating the dictionary root of a word. Notice how words like 'running' or 'ran' become 'run'.",
            pos: "Part-of-Speech (POS) Tagging: Analyzing the context of each word to determine if it is a Noun, Verb, Adjective, etc.",
            ner: "Named Entity Recognition (NER): Extracting real-world subjects. (Tip: NLP models rely heavily on Capitalized letters to find names and places!)"
        };

        function clearOutput() {
            document.getElementById('inputText').value = "";
            document.getElementById('definitionBox').classList.add('hidden');
            document.getElementById('output').innerHTML = `
                <div class="flex flex-col items-center justify-center h-full text-slate-400">
                    <i data-lucide="database" class="w-12 h-12 mb-4 opacity-20"></i>
                    <p>Awaiting linguistic input...</p>
                </div>`;
            lucide.createIcons();
        }

        function showDefinition(action) {
            const defBox = document.getElementById('definitionBox');
            if (DEFINITIONS[action]) {
                defBox.innerHTML = `<div class="flex items-start gap-2"><i data-lucide="info" class="w-5 h-5 mt-0.5"></i> <span>${DEFINITIONS[action]}</span></div>`;
                defBox.classList.remove('hidden');
                lucide.createIcons();
            } else {
                defBox.classList.add('hidden');
            }
        }

        function runNLP(action) {
            const text = document.getElementById('inputText').value;
            if(!text) {
                alert("Please enter some text to analyze!");
                return;
            }
            
            showDefinition(action);
            const doc = nlp(text);
            const output = document.getElementById('output');
            let content = "";

            switch(action) {
                case 'tokenize':
                    const tokens = doc.terms().out('array');
                    content = `<div class="flex flex-wrap gap-2">${tokens.map(t => `<span class="bg-blue-50 text-blue-700 px-3 py-1 rounded-md border border-blue-200 font-medium shadow-sm">${t}</span>`).join("")}</div>`;
                    break;

                case 'stopwords':
                    // We use regex split to keep spaces intact so sentences read naturally
                    const wordsWithSpaces = text.split(/(\s+)/);
                    content = `<div class="text-lg leading-relaxed bg-slate-50 p-4 rounded-xl border border-slate-200 text-slate-700">${wordsWithSpaces.map(w => {
                        if(!w.trim()) return w; // keep spaces
                        const cleanWord = w.toLowerCase().replace(/[^\w]/g, '');
                        const isStop = STOPWORDS.includes(cleanWord);
                        // Highlight in red if it's a stopword
                        return isStop 
                            ? `<span class="bg-red-100 text-red-600 font-bold px-1 rounded shadow-sm">${w}</span>` 
                            : w;
                    }).join("")}</div>`;
                    break;

                case 'lemmatize':
                    // Compute roots properly for the entire document
                    doc.compute('root');
                    // Flatmap ensures we get terms from ALL sentences, not just the first one
                    const allTerms = doc.json().flatMap(sentence => sentence.terms);
                    
                    content = `<div class="bg-slate-50 p-4 rounded-xl border border-slate-200 font-mono text-sm text-slate-600 space-y-2">`;
                    allTerms.forEach(t => {
                        const original = t.text;
                        const root = t.root || t.normal || original;
                        if(original.trim()) {
                            // Highlight words that actually changed
                            const changed = original.toLowerCase() !== root.toLowerCase();
                            content += `<div class="inline-block mr-4 mb-2"><span class="${changed ? 'text-purple-600 font-bold' : 'text-slate-400'}">${original}</span> <span class="text-slate-300">→</span> <span class="font-bold text-slate-800">${root}</span></div>`;
                        }
                    });
                    content += `</div>`;
                    break;

                case 'pos':
                    // FlatMap fixes the "only first sentence" bug
                    const posTerms = doc.json().flatMap(sentence => sentence.terms);
                    content = `<div class="grid grid-cols-2 md:grid-cols-3 gap-3">${posTerms.map(t => {
                        if(!t.text.trim()) return "";
                        let color = "bg-slate-100 text-slate-600 border-slate-200";
                        let tag = t.tags[0] || "Unknown";
                        
                        if(t.tags.includes('Noun')) color = "bg-blue-50 text-blue-700 border-blue-200";
                        if(t.tags.includes('Verb')) color = "bg-emerald-50 text-emerald-700 border-emerald-200";
                        if(t.tags.includes('Adjective')) color = "bg-purple-50 text-purple-700 border-purple-200";
                        if(t.tags.includes('Adverb')) color = "bg-orange-50 text-orange-700 border-orange-200";
                        
                        return `<div class="flex flex-col p-2 border rounded-lg ${color} shadow-sm">
                                    <span class="font-bold text-sm">${t.text}</span>
                                    <span class="text-[10px] uppercase tracking-wider opacity-75 font-semibold mt-1">${tag}</span>
                                </div>`;
                    }).join("")}</div>`;
                    break;

                case 'ner':
                    const p = doc.people().out('array');
                    const pl = doc.places().out('array');
                    const o = doc.organizations().out('array');
                    
                    content = `
                        <div class="space-y-4">
                            <div class="p-4 bg-red-50 rounded-xl border border-red-200">
                                <h4 class="text-xs font-bold text-red-500 uppercase mb-3 flex items-center gap-1"><i data-lucide="user" class="w-4 h-4"></i> People</h4>
                                <div class="flex flex-wrap gap-2">${p.length ? p.map(i=>`<span class="bg-white border border-red-100 px-3 py-1.5 rounded shadow-sm text-sm font-medium text-slate-800">${i}</span>`).join("") : '<span class="text-slate-400 italic text-sm">No people detected. Ensure names are capitalized.</span>'}</div>
                            </div>
                            <div class="p-4 bg-blue-50 rounded-xl border border-blue-200">
                                <h4 class="text-xs font-bold text-blue-500 uppercase mb-3 flex items-center gap-1"><i data-lucide="map-pin" class="w-4 h-4"></i> Places</h4>
                                <div class="flex flex-wrap gap-2">${pl.length ? pl.map(i=>`<span class="bg-white border border-blue-100 px-3 py-1.5 rounded shadow-sm text-sm font-medium text-slate-800">${i}</span>`).join("") : '<span class="text-slate-400 italic text-sm">No places detected. Ensure locations are capitalized.</span>'}</div>
                            </div>
                            <div class="p-4 bg-emerald-50 rounded-xl border border-emerald-200">
                                <h4 class="text-xs font-bold text-emerald-500 uppercase mb-3 flex items-center gap-1"><i data-lucide="building" class="w-4 h-4"></i> Organizations</h4>
                                <div class="flex flex-wrap gap-2">${o.length ? o.map(i=>`<span class="bg-white border border-emerald-100 px-3 py-1.5 rounded shadow-sm text-sm font-medium text-slate-800">${i}</span>`).join("") : '<span class="text-slate-400 italic text-sm">No organizations detected. Ensure company names are capitalized.</span>'}</div>
                            </div>
                        </div>`;
                    break;
            }
            output.innerHTML = content;
            lucide.createIcons();
        }

        async function runTensorFlow() {
            const text = document.getElementById('inputText').value;
            if(!text) {
                alert("Please enter text to analyze.");
                return;
            }
            
            showDefinition('tf');
            document.getElementById('definitionBox').innerHTML = `<div class="flex items-start gap-2 text-yellow-800 bg-yellow-50 p-4 border-l-4 border-yellow-500 rounded-r-lg shadow-sm font-medium"><i data-lucide="shield-alert" class="w-5 h-5 mt-0.5"></i> <span>Toxicity Check: Using a deep learning model to identify harmful content. Processing text...</span></div>`;
            document.getElementById('definitionBox').classList.remove('hidden');
            lucide.createIcons();
            
            const output = document.getElementById('output');
            output.innerHTML = `<div class="flex flex-col items-center justify-center h-full"><div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600 mb-4"></div><p class="text-slate-500 font-medium">Downloading Neural Model...</p></div>`;

            try {
                const model = await toxicity.load(0.9);
                const predictions = await model.classify([text]);
                let html = `<div class="space-y-3">`;
                predictions.forEach(p => {
                    const isDetected = p.results[0].match;
                    html += `
                        <div class="flex items-center justify-between p-4 rounded-xl border ${isDetected ? 'bg-red-50 border-red-200 shadow-sm' : 'bg-slate-50 border-slate-200'}">
                            <span class="text-sm font-bold uppercase tracking-wider flex items-center gap-2 ${isDetected ? 'text-red-700' : 'text-slate-500'}">
                                ${isDetected ? '<i data-lucide="alert-triangle" class="w-4 h-4 text-red-500"></i>' : ''} ${p.label.replace('_', ' ')}
                            </span>
                            <span class="text-xs font-bold px-3 py-1 rounded-full ${isDetected ? 'bg-red-600 text-white shadow-sm' : 'bg-slate-200 text-slate-500'}">
                                ${isDetected ? 'DETECTED' : 'CLEAN'}
                            </span>
                        </div>`;
                });
                output.innerHTML = html + `</div>`;
                lucide.createIcons();
            } catch (e) {
                output.innerHTML = `<p class="text-red-500">Model Load Error. Check Console.</p>`;
            }
        }
    </script>
</body>
</html>
